[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vischema"
version = "0.0.1"
description = "schema visualizer in anywidget"
readme = "README.md"
authors = [
  {name = "Ryan Lim", email = "rzlim08@gmail.com"}
]
maintainers = [
  {name = "Ryan Lim", email = "rzlim08@gmail.com"}
]
classifiers = [

]
license = {text = "MIT license"}

dependencies = [
    "anywidget>=0.11.0",
    "jsonschema>=4.26.0",
    "linkml>=1.11.1",
    "linkml-runtime>=1.11.1",
    "marimo>=0.23.6",
    "traitlets>=5.15.0",
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "pytest", # testing
    "mypy",  # linting
    "ruff",  # linting
]
build = [
    "build",
    "twine"
]

[project.urls]

bugs = "https://github.com/rzlim08/vischema/issues"
changelog = "https://github.com/rzlim08/vischema/blob/master/changelog.md"
homepage = "https://github.com/rzlim08/vischema"


# ... your project metadata stays the same ...

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# This tells setuptools to bundle the assets folder inside vischema
"vischema.assets" = ["*.js", "*.css"]


[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"
